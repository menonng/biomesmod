// Applied by every versions/<mc>/build.gradle after Loom is applied.
version = "${rootProject.mod_version}+${project.minecraft_version}"
group = rootProject.maven_group
base { archivesName = rootProject.archives_base_name }

repositories {
	maven { name = 'Glitchfiend (TerraBlender)'; url = 'https://maven.minecraftforge.net/' }
}

def commonDir = rootProject.file('common/src/main')
sourceSets.main {
	kotlin.srcDir(new File(commonDir, 'kotlin'))
	resources.srcDir(new File(commonDir, 'resources'))
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
	withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = project.java_version as int
}
// The mod is written in Kotlin; the JVM target follows the Java toolchain above (21 for 1.21.1, 25 for 26.2).
kotlin {
	jvmToolchain(project.java_version as int)
}

processResources {
	def props = [
		version: project.version,
		minecraft_dependency: project.minecraft_dependency,
		java_version: project.java_version,
		fabric_kotlin_version: rootProject.fabric_kotlin_version,
	]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}


// Dev-only 'gametest' source set (never packaged into the release jar): the engine showcases
// (common/src/gametest) and their per-version fabric.mod.json (versions/<mc>/src/gametest).
def gametestDir = rootProject.file('common/src/gametest')
sourceSets {
	gametest {
		kotlin.srcDir(new File(gametestDir, 'kotlin'))
		resources.srcDir(new File(gametestDir, 'resources'))
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

// Headless self-check: boots a dedicated server on a fresh seed-0 world (-Ppreset picks the world preset, default
// minecraft:normal), checks every mod biome in its dimension, then exits 0/1. -PextraMods=<dir> adds every jar in that
// folder to the run (compatibility tests with other worldgen mods).
loom {
	mods {
		biomesmod { sourceSet sourceSets.main }
		'biomesmod-gametest' { sourceSet sourceSets.gametest }
	}
	runs {
		selfCheck {
			server()
			name = "Self Check (${project.minecraft_version})"
			runDir = "run/selfcheck"
			source sourceSets.gametest
			vmArg '-Dbiomesmod.selfcheck=true'
			vmArg "-Dbiomesmod.showcase=${project.findProperty('showcase') ?: ''}"
			vmArg "-Dbiomesmod.showcase.only=${project.findProperty('only') ?: ''}"
			vmArg "-Dbiomesmod.render=${project.findProperty('render') ?: 'false'}"
			vmArg "-Dbiomesmod.render.only=${project.findProperty('renderOnly') ?: ''}"
			vmArg "-Dbiomesmod.overview=${project.findProperty('overview') ?: 'false'}"
			vmArg "-Dbiomesmod.render.size=${project.findProperty('renderSize') ?: '256'}"
			vmArg "-Dbiomesmod.selfcheck.only=${project.findProperty('biomes') ?: ''}"
			if (project.hasProperty('extraMods')) {
				vmArg "-Dfabric.addMods=${file(project.property('extraMods')).absolutePath}"
			}
		}
	}
}
// Fresh world every run, so worldgen changes are always exercised. The run directory is a throwaway dev server.
tasks.matching { it.name == 'runSelfCheck' }.configureEach {
	doFirst {
		def dir = file('run/selfcheck')
		delete new File(dir, 'world')
		dir.mkdirs()
		// -Pdatapacks=<dir>: every zip in it goes into the new world (worldgen data packs must be there at creation).
		def packs = ['vanilla']
		if (project.hasProperty('datapacks')) {
			def target = new File(dir, 'world/datapacks')
			target.mkdirs()
			file(project.property('datapacks')).listFiles().findAll { it.name.endsWith('.zip') }.each { zip ->
				java.nio.file.Files.copy(zip.toPath(), new File(target, zip.name).toPath())
				packs << "file/${zip.name}"
			}
		}
		new File(dir, 'eula.txt').text = 'eula=true' + System.lineSeparator()
		new File(dir, 'server.properties').text = [
			'level-seed=0',
			"initial-enabled-packs=${packs.join(',')}",
			"level-type=${project.findProperty('preset') ?: 'minecraft:normal'}",
			'online-mode=false',
			'server-port=25599',
			'enable-rcon=false',
			'spawn-protection=0',
			'view-distance=4',
			'simulation-distance=4',
			'sync-chunk-writes=false',
			// The checks run on the server thread for minutes; the watchdog would kill the server.
			'max-tick-time=-1',
		].join(System.lineSeparator()) + System.lineSeparator()
	}
}
