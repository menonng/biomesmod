modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/menonng/biomesmod/issues"

[[mods]]
modId = "biomesmod"
version = "${version}"
displayName = "Biomes Mod"
logoFile = "assets/biomesmod/icon.png"
authors = "menonng"
displayURL = "https://github.com/menonng/biomesmod"
description = '''64 biomes built after real places, each at its real elevation: salt flats, fjords, calderas, canyons, ice sheets, dune seas. With the blocks to dress them.'''

[[mixins]]
config = "biomesmod.mixins.json"

[[mixins]]
config = "biomesmod.neoforge.mixins.json"

[[dependencies.biomesmod]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_min},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.biomesmod]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.biomesmod]]
modId = "terrablender"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.biomesmod]]
modId = "kotlinforforge"
type = "required"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
