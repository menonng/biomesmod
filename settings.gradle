pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Auto-provisions the JDK each version needs (21 for 1.21.1, 25 for 26.2).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'biomesmod'

// One Gradle subproject per supported Minecraft version.
// Shared code/resources live in common/ and are compiled into every version.
// Fabric projects are named after the Minecraft version, the others after version and loader.
['1.20.1', '1.21.1', '26.2', '1.21.1-neoforge', '26.2-neoforge'].each { mc ->
	include(mc)
	project(":$mc").projectDir = file("versions/$mc")
}
