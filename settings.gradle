pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Auto-provisions the JDK each version needs (21 for 1.21.1, 25 for 26.2).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'biomesmod'

// One Gradle subproject per supported Minecraft version.
// Shared code/resources live in common/ and are compiled into every version.
['1.21.1', '26.2'].each { mc ->
	include(mc)
	project(":$mc").projectDir = file("versions/$mc")
}
