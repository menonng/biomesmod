plugins {
	id 'net.fabricmc.fabric-loom'
	id 'org.jetbrains.kotlin.jvm'
}
apply from: rootProject.file('common.gradle')

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${rootProject.fabric_kotlin_version}"
}

// Dev-only docs screenshot director (never packaged): a client that quick-plays the pre-generated world
// run/shots/saves/shots and photographs every biome from a plan (see ShotDirector). Shader/LOD mods are added from
// -PclientMods=<dir> (every jar in it), e.g. Sodium, Iris and Voxy.
//   ./gradlew :26.2:runShots -Pplan=<plan.json> -PclientMods=<dir> [-Ponly=a,b] [-PshotsHeap=6G]
sourceSets {
	shots {
		kotlin.srcDir('src/shots/kotlin')
		resources.srcDir('src/shots/resources')
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}
loom {
	mods {
		'biomesmod-shots' { sourceSet sourceSets.shots }
	}
	runs {
		shots {
			client()
			name = 'Docs Screenshots (26.2)'
			runDir = 'run/shots'
			source sourceSets.shots
			vmArg "-Xmx${project.findProperty('shotsHeap') ?: '10G'}"  // -PshotsHeap=6G when the machine is short of memory
			vmArg "-Dbiomesmod.shots=${file(project.findProperty('plan') ?: 'run/shots/plan.json').absolutePath}"
			vmArg "-Dbiomesmod.shots.only=${project.findProperty('only') ?: ''}"
			if (project.hasProperty('clientMods')) {
				vmArg "-Dfabric.addMods=${file(project.property('clientMods')).absolutePath}"
			}
			programArgs '--quickPlaySingleplayer', 'shots', '--width', '1920', '--height', '1080'
		}
	}
}
// src/shots/resources is both the convention and the declared dir of the shots source set: copy each file once.
tasks.named('processShotsResources') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
